[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namematch"
version = "0.1.0"
description = "Culture-aware human-name detection & matching (deterministic core, optional ML/LLM)"
readme = "README.md"
requires-python = ">=3.10"
# Core is pure stdlib by design (100% local, no network). No runtime deps.
dependencies = []

[project.optional-dependencies]
# Faster/stronger Latin phonetics & fuzzy distance.
fuzzy = ["rapidfuzz>=3", "jellyfish>=1", "abydos>=0.5"]
# Name-origin / nationality classifier backends.
origin-ml = ["name2nat"]
# LLM adjudication of hard review-bucket cases (Claude).
llm = ["anthropic>=0.40"]
# Arabic NLP (segmentation, diacritization) for higher-precision Arabic.
arabic = ["camel-tools"]
dev = ["pytest>=8"]

[project.scripts]
namematch = "namematch.cli:main"

[tool.setuptools.packages.find]
include = ["namematch*"]

[tool.setuptools.package-data]
# Unihan-derived Han->pinyin table (Unicode license) for Chinese romanization.
namematch = ["data/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
